<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">机场手记</title>
  <desc id="desc">持续整理的机场黄页，查厂商、找入口、读资料。</desc>
  <rect width="1280" height="360" rx="20" fill="#f3f2e9"/>
  <path d="M890 0V360M1010 0V360M1130 0V360M0 90H1280M0 210H1280M0 330H1280" stroke="#dfe2d5" stroke-width="1"/>
  <rect x="52" y="42" width="154" height="29" rx="14" fill="#203c2f"/>
  <text x="129" y="62" fill="#fff" text-anchor="middle" font-family="sans-serif" font-size="12" letter-spacing="2">AIRPORT NOTES</text>
  <text x="52" y="160" fill="#203c2f" font-family="'Microsoft YaHei',sans-serif" font-weight="700" font-size="66">机场手记</text>
  <text x="56" y="216" fill="#425b4a" font-family="'Microsoft YaHei',sans-serif" font-size="25">让分散的信息，更容易找到。</text>
  <text x="56" y="296" fill="#6a796b" font-family="'Microsoft YaHei',sans-serif" font-size="17">厂商目录 · 来源索引 · 使用反馈</text>
  <path d="M865 255L970 110L1085 210L1190 80" fill="none" stroke="#8b9b72" stroke-width="3"/>
  <g fill="#f3f2e9" stroke="#203c2f" stroke-width="3"><circle cx="865" cy="255" r="10"/><circle cx="970" cy="110" r="10"/><circle cx="1085" cy="210" r="10"/><circle cx="1190" cy="80" r="10"/></g>
  <text x="930" y="310" fill="#657661" font-family="monospace" font-size="14" letter-spacing="2">THE DIRECTORY</text>
</svg>
